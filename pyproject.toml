[project]
name = "magic-grimoire"
version = "0.1.0"
description = "Telegram RAG Study Agent — query your documents with LlamaIndex + Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-telegram-bot>=21",
    "numpy>=1.26",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "llama-index>=0.12",
    "llama-index-llms-ollama>=0.5",
    "llama-index-embeddings-ollama>=0.5",
    "llama-index-readers-file>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
]
liteparse = ["liteparse"]

[tool.hatch.build.targets.wheel]
packages = ["app/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
